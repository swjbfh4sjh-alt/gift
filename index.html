<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎁 Gift</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Georgia','Palatino','Times New Roman','Songti SC',serif; }
.page-bg { position:fixed; inset:0; z-index:0; background: url('生日背景.jpg') center/cover no-repeat; filter: brightness(0.65) saturate(0.9); }
.page-bg::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(40,25,15,0.2) 0%, rgba(40,25,15,0.4) 100%); }
.step { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.8s ease,transform 0.8s ease; transform:scale(0.93); padding:20px; }
.step.active { opacity:1; pointer-events:auto; transform:scale(1); }
.step.exit { opacity:0; pointer-events:none; transform:scale(1.04); }

/* ===== 封面 ===== */
.cover-wrap { width:100%; max-width:520px; cursor:pointer; }
.cover-wrap img { width:100%; height:auto; max-height:75vh; object-fit:contain; border-radius:24px; }
.cover-hint { margin-top:18px; font-size:12px; color:rgba(232,195,140,0.35); letter-spacing:4px; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

/* ===== 卡片 ===== */
.vintage-card { position:relative; background:rgba(250,245,235,0.18); backdrop-filter:blur(16px) saturate(1.1); -webkit-backdrop-filter:blur(16px) saturate(1.1); border-radius:28px; padding:20px; box-shadow:0 8px 40px rgba(0,0,0,0.2),0 1px 0 rgba(255,248,235,0.12) inset,0 0 0 1px rgba(255,248,235,0.06) inset; border:1px solid rgba(232,210,180,0.08); max-width:92vw; display:flex; flex-direction:column; align-items:center; }
.corner-deco { position:absolute; font-size:12px; color:rgba(232,195,140,0.2); pointer-events:none; }
.corner-deco.tl { top:12px; left:16px; } .corner-deco.tr { top:12px; right:16px; } .corner-deco.bl { bottom:12px; left:16px; } .corner-deco.br { bottom:12px; right:16px; }

.img-wrap { width:100%; border-radius:18px; overflow:hidden; }
.img-wrap img { display:block; width:100%; height:auto; max-height:58vh; object-fit:contain; border-radius:18px; filter:sepia(0.15) saturate(0.85) brightness(1.05); }
#step1 .img-wrap img { max-height:none; max-width:100%; height:auto; object-fit:contain; filter:sepia(0.15) saturate(0.85) brightness(1.05); }
#step1 { overflow-y:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start; padding-top:20px; }
#step1 .vintage-card { max-height:none; margin-top:10px; }

/* ===== 音乐按钮 ===== */
.music-bar { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:14px; padding:8px 24px; border-radius:40px; background:rgba(250,245,235,0.06); backdrop-filter:blur(8px); border:1px solid rgba(232,195,140,0.06); cursor:pointer; transition:all 0.35s ease; -webkit-user-select:none; user-select:none; }
.music-bar:hover { background:rgba(250,245,235,0.10); }
.music-bar-icon { width:32px; height:32px; border-radius:50%; background:rgba(232,195,140,0.08); display:flex; align-items:center; justify-content:center; font-size:13px; color:rgba(245,237,224,0.5); transition:all 0.3s ease; }
.music-bar.playing .music-bar-icon { background:rgba(232,195,140,0.15); color:rgba(232,195,140,0.6); }
.music-bar-label { font-size:12px; color:rgba(245,237,224,0.3); letter-spacing:3px; }
.music-bar.playing .music-bar-label { color:rgba(232,195,140,0.4); }

.btn-next,.btn-back { padding:10px 36px; border:none; border-radius:40px; background:rgba(232,195,140,0.15); backdrop-filter:blur(8px); color:rgba(245,237,224,0.8); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:4px; border:1px solid rgba(232,195,140,0.12); transition:all 0.35s ease; }
.btn-next:hover,.btn-back:hover { background:rgba(232,195,140,0.22); color:#f5ede0; transform:translateY(-1px); }
.btn-next:active,.btn-back:active { transform:scale(0.97); }
.btn-back { background:rgba(255,255,255,0.04); color:rgba(245,237,224,0.45); letter-spacing:2px; font-size:12px; padding:7px 20px; }
.btn-back:hover { background:rgba(255,255,255,0.08); color:rgba(245,237,224,0.7); }

.step-nav { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
#step2 .vintage-card, #step3 .vintage-card { padding:14px; max-width:92vw; }
#step2 .img-wrap img, #step3 .img-wrap img { max-height:62vh; }
#step3 .img-wrap { border-radius:28px; overflow:hidden; }
#step3 .img-wrap img, #step3 .img-wrap video { border-radius:28px; display:block; width:100%; max-height:58vh; object-fit:contain; }
#step3 .img-wrap { border-radius:28px; }

.wish-area { width:100%; margin-top:12px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.wish-trigger { padding:9px 30px; border:none; border-radius:40px; background:rgba(232,195,140,0.10); backdrop-filter:blur(8px); color:rgba(245,237,224,0.6); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:3px; border:1px solid rgba(232,195,140,0.08); transition:all 0.35s ease; }
.wish-trigger:hover { background:rgba(232,195,140,0.18); color:rgba(245,237,224,0.85); }
.wish-display-area { width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; }
.wish-strip { background:rgba(250,245,235,0.08); backdrop-filter:blur(12px); border-radius:16px; padding:10px 22px; font-size:16px; color:#f5ede0; border:1px solid rgba(250,245,235,0.08); opacity:0; transform:translateY(12px) scale(0.94); transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1); letter-spacing:1px; line-height:1.6; text-align:center; max-width:100%; }
.wish-strip.show { opacity:1; transform:translateY(0) scale(1); }

#step3 .vintage-card { padding:18px; }
.wish4-area { width:100%; margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.wish4-title { font-size:15px; color:rgba(245,237,224,0.8); letter-spacing:3px; }
.wish4-row { width:100%; display:flex; gap:8px; align-items:center; }
.wish4-row input { flex:1; padding:10px 18px; border:none; border-radius:40px; background:rgba(250,245,235,0.06); backdrop-filter:blur(8px); color:#f5ede0; font-size:14px; font-family:inherit; border:1px solid rgba(232,195,140,0.10); outline:none; transition:all 0.35s ease; }
.wish4-row input::placeholder { color:rgba(245,237,224,0.25); }
.wish4-row input:focus { background:rgba(250,245,235,0.10); border-color:rgba(232,195,140,0.2); }
.wish4-row button { padding:10px 22px; border:none; border-radius:40px; background:rgba(232,195,140,0.12); backdrop-filter:blur(8px); color:rgba(245,237,224,0.7); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:2px; border:1px solid rgba(232,195,140,0.08); transition:all 0.35s ease; white-space:nowrap; }
.wish4-row button:hover { background:rgba(232,195,140,0.2); color:#f5ede0; }
.wish4-show { width:100%; min-height:24px; font-size:14px; color:rgba(245,237,224,0.45); text-align:center; letter-spacing:1px; transition:all 0.4s ease; }
.wish4-nav { display:flex; gap:10px; margin-top:2px; flex-wrap:wrap; justify-content:center; }

/* ===== 信封贺卡 ===== */
.env-scene { display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; width:100%; }
.env-wrap { position:relative; width:100%; max-width:260px; }
.env-svg { width:100%; height:auto; overflow:visible; }
.env-draw { fill:none; stroke:rgba(232,213,181,0.4); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:800; stroke-dashoffset:800; animation:envDraw 1.2s ease forwards; }
.env-d2 { animation-delay:0.2s; }
.env-d3 { animation-delay:0.5s; }
.env-d4 { animation-delay:0.7s; }
@keyframes envDraw { to { stroke-dashoffset:0; } }

.env-flap { fill:none; stroke:rgba(232,213,181,0.4); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:600; stroke-dashoffset:600; animation:envDraw 1s ease 0.3s forwards; transform-origin:center bottom; transition:transform 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s; }
.env-scene.open .env-flap { transform:rotateX(-120deg); opacity:0.3; }
.env-scene.open #envHeart { opacity:0; transition:opacity 0.3s ease; }

.env-letter { transform:translateY(0); transition:transform 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s; opacity:1; }
.env-scene.open .env-letter { transform:translateY(-30px); }

.letter-text { position:absolute; top:40px; left:50%; transform:translateX(-50%); width:170px; text-align:center; pointer-events:none; opacity:0; transition:all 0.8s ease 0.5s; }
.env-scene.open .letter-text { opacity:1; }
.letter-line { font-family:'Snell Roundhand','Brush Script MT','Apple Chancery',cursive; color:rgba(245,237,224,0.85); text-shadow:0 1px 8px rgba(0,0,0,0.1); line-height:1.6; }
.letter-line.l1 { font-size:17px; letter-spacing:3px; margin-bottom:4px; }
.letter-line.l2 { font-size:20px; letter-spacing:2px; margin-bottom:10px; }
.letter-line.l3 { font-size:16px; letter-spacing:2px; margin-top:6px; }
.letter-line.l4 { font-size:12px; letter-spacing:2px; color:rgba(232,195,140,0.45); margin-top:8px; }

.env-hint { position:absolute; bottom:-28px; left:50%; transform:translateX(-50%); font-size:11px; color:rgba(232,195,140,0.3); letter-spacing:3px; white-space:nowrap; animation:pulse 2s ease-in-out infinite; }
.env-scene.open .env-hint { opacity:0; transition:opacity 0.3s ease; }

.cake-flame { fill:rgba(245,237,224,0.6); stroke:none; animation:flameFlicker 0.2s ease-in-out infinite alternate; transform-origin:center bottom; }
.cake-glow { fill:rgba(232,195,140,0.08); stroke:none; animation:glowPulse 0.8s ease-in-out infinite alternate; }
@keyframes flameFlicker { 0%{d:path("M100 36 Q94 28 100 20 Q106 28 100 36Z");opacity:0.8} 25%{d:path("M100 36 Q93 27 100 19 Q107 27 100 36Z");opacity:1} 50%{d:path("M100 36 Q95 29 100 21 Q105 29 100 36Z");opacity:0.85} 75%{d:path("M100 36 Q94 27 100 18 Q106 27 100 36Z");opacity:0.95} 100%{d:path("M100 36 Q93 28 100 20 Q107 28 100 36Z");opacity:0.8} }
@keyframes glowPulse { 0%{opacity:0.06;transform:scale(1)} 100%{opacity:0.12;transform:scale(1.15)} }

.cake-scene.blown .cake-flame-g { animation:blowOut 0.5s ease-out forwards; }
.cake-scene.blown .cake-hint { opacity:0; transition:opacity 0.3s ease; }
@keyframes blowOut { 0%{opacity:1;transform:scale(1)} 30%{transform:scale(1.5) translateX(-5px);opacity:0.6} 100%{transform:scale(0.1);opacity:0} }

.cake-hint { margin-top:8px; font-size:11px; color:rgba(232,195,140,0.25); letter-spacing:2px; animation:pulse 2s ease-in-out infinite; }

/* 浮动 */
.floating-item { position:fixed; pointer-events:none; z-index:2; opacity:0; animation:floatDown linear forwards; }
.floating-item svg { display:block; width:100%; height:100%; }
@keyframes floatDown { 0%{opacity:0;transform:translateY(-60px) rotate(0deg) scale(0.3)} 10%{opacity:0.35} 85%{opacity:0.25} 100%{opacity:0;transform:translateY(calc(100vh+80px)) rotate(720deg) scale(1)} }
.bubble { position:fixed; pointer-events:none; z-index:8; animation:bubbleUp 2s ease-out forwards; }
.bubble svg { display:block; width:100%; height:100%; }
@keyframes bubbleUp { 0%{opacity:1;transform:translateY(0) scale(0.2)} 45%{opacity:1} 100%{opacity:0;transform:translateY(-200px) scale(1.1)} }
.confetti-piece { position:fixed; pointer-events:none; z-index:4; animation:confettiFall linear forwards; }
@keyframes confettiFall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg)} 100%{opacity:0;transform:translateY(calc(100vh+40px)) rotate(1080deg)} }

@media (max-width:480px) {
  .vintage-card { padding:12px !important; border-radius:18px !important; }
  .img-wrap img { max-height:45vh !important; }
  .cover-wrap img { max-height:65vh; }
  .wish-strip { font-size:14px; padding:8px 14px; }
}
</style>
</head>
<body>
<div class="page-bg"></div>

<!-- ===== 步骤0 — 封面 + 音乐 ===== -->
<div class="step active" id="step0">
  <div class="cover-wrap" id="coverWrap">
    <img src="生日背景_opt.jpg" alt="封面">
  </div>
  <div class="music-bar" id="musicBar" style="margin-top:18px;">
    <span class="music-bar-icon" id="musicIcon">♫</span>
    <span class="music-bar-label" id="musicLabel">播放音乐</span>
  </div>
  <div class="cover-hint" id="coverHint">✦  touch to open  ✦</div>
</div>

<!-- ===== 步骤1 — 生日隐喻 ===== -->
<div class="step" id="step1">
  <div class="vintage-card">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="img-wrap"><img src="生日隐喻_opt.jpg" alt="生日隐喻"></div>
    <div class="step-nav">
      <button class="btn-next" id="btn1">继续  →</button>
    </div>
  </div>
</div>


<!-- ===== 步骤2 — 信封贺卡 ===== -->
<div class="step" id="step2">
  <div class="vintage-card" style="padding:24px 28px;">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="env-scene" id="envScene">
      <div class="env-wrap">
        <svg class="env-svg" viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg">
          <!-- 信封装饰边框 -->
          <rect class="env-draw" x="12" y="12" width="236" height="148" rx="4" stroke-dasharray="900" stroke-dashoffset="900" />
          <!-- 角落花纹 -->
          <path class="env-draw env-d2" d="M12 12 Q30 12 30 30" stroke-width="1" />
          <path class="env-draw env-d2" d="M248 12 Q230 12 230 30" stroke-width="1" />
          <path class="env-draw env-d2" d="M12 160 Q30 160 30 142" stroke-width="1" />
          <path class="env-draw env-d2" d="M248 160 Q230 160 230 142" stroke-width="1" />
          <!-- 信封 flap -->
          <path class="env-flap" id="envFlap" d="M12 12 L130 78 L248 12" stroke-dasharray="600" stroke-dashoffset="600" />
          <!-- 信封折线 -->
          <line class="env-draw env-d2" x1="12" y1="12" x2="130" y2="78" stroke-width="1" />
          <line class="env-draw env-d2" x1="248" y1="12" x2="130" y2="78" stroke-width="1" />
          <!-- 腰线 -->
          <line class="env-draw env-d3" x1="15" y1="90" x2="245" y2="90" stroke-width="0.8" stroke-dasharray="3 6" />
          <!-- 心形封口 -->
          <path class="env-draw env-d4" id="envHeart" d="M130 65 C130 53 118 45 112 50 C106 55 106 64 130 74 C154 64 154 55 148 50 C142 45 130 53 130 65Z" fill="rgba(232,195,140,0.12)" stroke-width="1" />
          <!-- 信纸 -->
          <g class="env-letter" id="envLetter">
            <rect class="env-draw env-d4" x="28" y="24" width="204" height="128" rx="3" />
          </g>
        </svg>
        <!-- 文案（独立于SVG，便于字体渲染） -->
        <div class="letter-text" id="letterText">
          <div class="letter-line l1">亲爱的胡老师</div>
          <div class="letter-line l2">祝你生日快乐</div>
          <div class="letter-line l3">爱你的鸡鸭</div>
          <div class="letter-line l4">2026.6.10</div>
        </div>
        <div class="env-hint" id="envHint">✦  touch to open  ✦</div>
      </div>
    </div>
    <div class="wish-area" style="margin-top:4px;">
      <button class="wish-trigger" id="wishTrigger">✦ 点一下 · 收祝福 ✦</button>
      <div class="wish-display-area"><div class="wish-strip" id="wishStrip"></div></div>
      <div class="step-nav" style="margin-top:6px;">
        <button class="btn-next" id="btn2">许个愿  →</button>
        <button class="btn-back" id="back2">← 返回</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 步骤4 — 许愿文本框 ===== -->
<div class="step" id="step3">
  <div class="vintage-card">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="img-wrap"><video autoplay loop muted playsinline preload="auto" style="width:100%;background:#1a0f0a;"><source src="结尾_phone.m4v" type="video/mp4"><source src="结尾.mp4" type="video/mp4"><source src="结尾.mov" type="video/quicktime"></video></div>
	    </div>    <div class="wish4-area">
      <div class="wish4-title">✍ 许下你的愿望吧小艺冉</div>
      <div class="wish4-row">
        <input type="text" id="customInput" placeholder="输入你的祝福…" maxlength="50">
        <button id="customSubmit">许愿 ✦</button>
      </div>
      <div class="wish4-show" id="customShow"></div>
      <div id="wishHistory" style="width:100%;display:none;"></div>
      <div class="wish4-nav">
        <button class="btn-back" id="back3">← 返回</button>
        <button class="btn-back" id="restartBtn" style="color:rgba(232,195,140,0.5);">⟳ 重新开始</button>
      </div>
    </div>
  </div>
</div>

<audio id="bgAudio" loop preload="metadata">
  <source src="background.m4a" type="audio/mp4">
</audio>

<script>
const SW='rgba(232,195,140,0.35)',SF='rgba(232,195,140,0.4)';
const SVGS={cat:'<svg viewBox="0 0 48 48"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M16 16 L12 4 L22 13"/><path d="M32 16 L36 4 L26 13"/><circle cx="24" cy="22" r="11"/><circle cx="20" cy="21" r="2" fill="'+SF+'"/><circle cx="28" cy="21" r="2" fill="'+SF+'"/><path d="M22 25 L24 26.5 L26 25" stroke-width="1.2"/><path d="M20 28 Q24 30.5 28 28" stroke-width="1"/><line x1="13" y1="24" x2="18" y2="24.5" stroke-width="1"/><line x1="13" y1="27" x2="18" y2="26.5" stroke-width="1"/><line x1="30" y1="24.5" x2="35" y2="24" stroke-width="1"/><line x1="30" y1="26.5" x2="35" y2="27" stroke-width="1"/><path d="M17 31 Q24 43 31 31"/></g></svg>',butterfly:'<svg viewBox="0 0 44 40"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><path d="M22 18 L12 6 Q8 4 6 8 Q4 12 10 14 L22 18Z"/><path d="M22 18 L12 28 Q8 30 6 26 Q4 22 10 20L22 18Z"/><path d="M22 18 L32 6 Q36 4 38 8 Q40 12 34 14 L22 18Z"/><path d="M22 18 L32 28 Q36 30 38 26 Q40 22 34 20L22 18Z"/><ellipse cx="22" cy="18" rx="1.8" ry="5" fill="'+SF+'"/><path d="M22 12 Q18 7 16 4" stroke-width="1"/><path d="M22 12 Q26 7 28 4" stroke-width="1"/><circle cx="16" cy="4" r="1.2" fill="'+SW+'"/><circle cx="28" cy="4" r="1.2" fill="'+SW+'"/></g></svg>',flower:'<svg viewBox="0 0 42 46"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><path d="M21 20 L21 44"/><path d="M18 28 Q11 25 14 30 Q16 33 18 28" stroke-width="1"/><path d="M24 34 Q31 31 28 36 Q26 39 24 34" stroke-width="1"/><circle cx="21" cy="12" r="7"/><circle cx="28" cy="17" r="6.5"/><circle cx="14" cy="17" r="6.5"/><circle cx="28" cy="27" r="6.5"/><circle cx="14" cy="27" r="6.5"/><circle cx="21" cy="19" r="3.5" fill="'+SF+'"/></g></svg>'};
const SKEYS=Object.keys(SVGS);
function createFloating(){var k=SKEYS[Math.floor(Math.random()*SKEYS.length)];var sz=24+Math.random()*20;var el=document.createElement('div');el.className='floating-item';el.style.left=Math.random()*100+'vw';el.style.width=sz+'px';el.style.height=sz+'px';el.style.animationDuration=(14+Math.random()*16)+'s';el.style.animationDelay=(Math.random()*6)+'s';el.innerHTML=SVGS[k];document.body.appendChild(el);setTimeout(function(){el.remove();},32000);}
for(var i=0;i<20;i++)setTimeout(createFloating,i*400);setInterval(createFloating,900);

function goToStep(a,b){var f=document.getElementById(a),t=document.getElementById(b);f.classList.remove('active');f.classList.add('exit');setTimeout(function(){f.classList.remove('exit');f.style.display='none';},800);t.style.display='flex';void t.offsetWidth;t.classList.add('active');}
function goBackTo(a,b){var f=document.getElementById(a),t=document.getElementById(b);f.classList.remove('active');f.classList.add('exit');setTimeout(function(){f.classList.remove('exit');f.style.display='none';},800);t.style.display='flex';void t.offsetWidth;t.classList.add('active');}
function fullReset(){['step3','step2','step1'].forEach(function(id){var e=document.getElementById(id);e.classList.remove('active');e.classList.add('exit');setTimeout(function(){e.classList.remove('exit');e.style.display='none';},800);});document.getElementById('step0').style.display='flex';void document.getElementById('step0').offsetWidth;document.getElementById('step0').classList.add('active');document.getElementById('wishStrip').className='wish-strip';document.getElementById('customShow').textContent='';}

document.getElementById('coverWrap').addEventListener('click',function(){goToStep('step0','step1');launchConfetti(15);launchBubbles();});

var bgAudio=document.getElementById('bgAudio');var musicStarted=false;
document.getElementById('musicBar').addEventListener('click',function(){if(!musicStarted){musicStarted=true;bgAudio.volume=0.3;}if(bgAudio.paused){bgAudio.play();document.getElementById('musicIcon').textContent='►';document.getElementById('musicLabel').textContent='播放中';document.getElementById('musicBar').classList.add('playing');}else{bgAudio.pause();document.getElementById('musicIcon').textContent='♫';document.getElementById('musicLabel').textContent='播放音乐';document.getElementById('musicBar').classList.remove('playing');}});

document.getElementById('btn1').addEventListener('click',function(){goToStep("step1","step2");launchBubbles();setTimeout(function(){launchConfetti(20);},300);});
document.getElementById('envScene').addEventListener('click',function(){if(!this.classList.contains('open')){this.classList.add('open');launchConfetti(15);}});
document.getElementById('btn2').addEventListener('click',function(){goToStep("step2","step3");launchBubbles();setTimeout(function(){launchConfetti(20);},300);});
document.getElementById('back2').addEventListener('click',function(){goBackTo("step2","step1");});
document.getElementById('back3').addEventListener('click',function(){goBackTo("step3","step2");});

document.getElementById('restartBtn').addEventListener('click',fullReset);

var WISHES=[{text:'胡老师考公上岸，金榜题名！',emoji:'✦'},{text:'胡老师和春宇永远幸福甜蜜！',emoji:'♥'},{text:'顺利美满，万事胜意！',emoji:'✧'}];
var lastIdx=-1;var ws=document.getElementById('wishStrip');
document.getElementById('wishTrigger').addEventListener('click',function(){var idx;do{idx=Math.floor(Math.random()*WISHES.length);}while(idx===lastIdx&&WISHES.length>1);lastIdx=idx;var w=WISHES[idx];ws.innerHTML=w.emoji+'  '+w.text;ws.className='wish-strip show';launchConfetti(12);});
var ci=document.getElementById('customInput'),cs=document.getElementById('customSubmit'),csh=document.getElementById('customShow');
// 保存的愿望列表
var savedWishes=JSON.parse(localStorage.getItem('yiranWishes')||'[]');
function saveWish(text){savedWishes.push(text);localStorage.setItem('yiranWishes',JSON.stringify(savedWishes));showWishHistory();}
function showWishHistory(){var el=document.getElementById('wishHistory');if(!el)return;if(savedWishes.length===0){el.style.display='none';return;}el.style.display='block';el.innerHTML=savedWishes.map(function(w,i){return '<div style="background:rgba(250,245,235,0.04);border-radius:10px;padding:6px 14px;margin-bottom:4px;font-size:13px;color:rgba(245,237,224,0.5);letter-spacing:1px;text-align:center;">♡ '+(i+1)+'. '+w+'</div>';}).join('');}
cs.addEventListener('click',function(){var v=ci.value.trim();if(!v){csh.textContent='✧ 写点什么吧～';csh.style.color='rgba(245,237,224,0.35)';return;}saveWish(v);csh.innerHTML='♡ 「'+v+'」<br><span style="font-size:12px;opacity:0.6">— 心愿已保存 ✦</span>';csh.style.color='rgba(245,237,224,0.8)';ci.value='';launchConfetti(30);launchBubbles();});
ci.addEventListener('keydown',function(e){if(e.key==='Enter')cs.click();});
// 初始化显示历史
setTimeout(showWishHistory,500);

var sc=['#f5ede0','#e8c8a0','#d4a373','#faedcd','#f8e7d0','#e3d5ca'];var st=0;
function addS(x,y){var el=document.createElement('div');el.style.cssText='position:fixed;pointer-events:none;z-index:99;left:'+(x-3)+'px;top:'+(y-3)+'px;width:'+(4+Math.random()*5)+'px;height:'+(4+Math.random()*5)+'px;border-radius:50%;background:'+sc[Math.floor(Math.random()*sc.length)]+';opacity:'+(0.4+Math.random()*0.4)+';box-shadow:0 0 '+(4+Math.random()*6)+'px rgba(232,195,140,0.3);transition:all 0.6s ease-out;transform:scale(0);';document.body.appendChild(el);requestAnimationFrame(function(){el.style.transform='scale(1) translate('+(-8+Math.random()*16)+'px,'+(-8+Math.random()*16)+'px)';el.style.opacity='0';});setTimeout(function(){el.remove();},700);}
document.addEventListener('touchmove',function(e){var n=Date.now();if(n-st<40)return;st=n;for(var i=0;i<3;i++){var t=e.touches[0];addS(t.clientX+Math.random()*6-3,t.clientY+Math.random()*6-3);}});
document.addEventListener('mousemove',function(e){if(!e.buttons)return;var n=Date.now();if(n-st<50)return;st=n;addS(e.clientX,e.clientY);});
document.addEventListener('click',function(e){var r=document.createElement('div');r.style.cssText='position:fixed;pointer-events:none;z-index:98;left:'+(e.clientX-20)+'px;top:'+(e.clientY-20)+'px;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(232,195,140,0.2);opacity:0.6;transition:all 0.8s ease-out;transform:scale(0.3);';document.body.appendChild(r);requestAnimationFrame(function(){r.style.transform='scale(2.5)';r.style.opacity='0';});setTimeout(function(){r.remove();},900);});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)<60)return;if(dx<0){if(document.getElementById('step1').classList.contains('active'))document.getElementById('btn1').click();else if(document.getElementById('step2').classList.contains('active'))document.getElementById('btn2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('btn2').click();}else{if(document.getElementById('step2').classList.contains('active'))document.getElementById('back2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('back3').click();else if(document.getElementById('step4').classList.contains('active'))document.getElementById('back3').click();}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){if(document.getElementById('step1').classList.contains('active'))document.getElementById('btn1').click();else if(document.getElementById('step2').classList.contains('active'))document.getElementById('btn2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('btn2').click();}if(e.key==='ArrowLeft'){if(document.getElementById('step2').classList.contains('active'))document.getElementById('back2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('back3').click();}if((e.key==='r'||e.key==='R')&&document.getElementById('step3').classList.contains('active'))fullReset();});

var CLRS=['#d4a373','#faedcd','#f8e7d0','#e3d5ca','#d5bdaf','#f1d5b5','#e8c8a0','#dcc5b0'];
function launchConfetti(c){for(var i=0;i<c;i++)setTimeout(function(){var p=document.createElement('div');p.className='confetti-piece';p.style.background=CLRS[Math.floor(Math.random()*CLRS.length)];p.style.left=Math.random()*100+'vw';p.style.width=(3+Math.random()*7)+'px';p.style.height=(3+Math.random()*7)+'px';p.style.borderRadius=Math.random()>0.5?'50%':'2px';p.style.animationDuration=(2.5+Math.random()*2.5)+'s';document.body.appendChild(p);setTimeout(function(){p.remove();},5500);},i*30);}
function launchBubbles(){var ks=['cat','butterfly','flower'];for(var i=0;i<5;i++)setTimeout(function(){var k=ks[Math.floor(Math.random()*ks.length)];var sz=16+Math.random()*16;var el=document.createElement('div');el.className='bubble';el.style.left=(15+Math.random()*70)+'%';el.style.bottom='10%';el.style.width=sz+'px';el.style.height=sz+'px';el.innerHTML=SVGS[k];document.body.appendChild(el);setTimeout(function(){el.remove();},2500);},i*120);}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎁 Gift</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Georgia','Palatino','Times New Roman','Songti SC',serif; }

.page-bg { position:fixed; inset:0; z-index:0; background: url('生日背景.jpg') center/cover no-repeat; filter: brightness(0.65) saturate(0.9); }
.page-bg::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(40,25,15,0.2) 0%, rgba(40,25,15,0.4) 100%); }

.step { position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition: opacity 0.8s ease, transform 0.8s ease; transform:scale(0.93); padding:20px; }
.step.active { opacity:1; pointer-events:auto; transform:scale(1); }
.step.exit { opacity:0; pointer-events:none; transform:scale(1.04); }

/* ===== 礼物盒 - 简笔画风格 ===== */
.gift-scene { display:flex; flex-direction:column; align-items:center; cursor:pointer; user-select:none; -webkit-user-select:none; }
.gift-svg-wrap { position:relative; width:220px; height:220px; }

.gift-svg-wrap svg { width:100%; height:100%; overflow:visible; }

/* 线条绘制动画 */
.draw-line { fill:none; stroke:#e8d5b5; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:800; stroke-dashoffset:800; animation: drawIn 1.2s ease forwards; }
.draw-line-delay { animation-delay:0.3s; }
.draw-line-delay2 { animation-delay:0.6s; }
.draw-line-delay3 { animation-delay:0.9s; }

@keyframes drawIn { to { stroke-dashoffset:0; } }

/* 蝴蝶结飘走 */
.bow-group { transform-origin:110px 50px; transition: transform 0.8s cubic-bezier(0.34,1.56,0.64,1), opacity 0.6s ease; }
.bow-group.open { transform:translateY(-50px) rotate(-15deg) scale(0.7); opacity:0; }

/* 缎带滑落 */
.ribbon-group { transition: all 0.7s ease 0.2s; }
.ribbon-group.open { transform:translateY(30px); opacity:0; }

/* 包装纸撕开 */
.paper-left { transform-origin:right center; transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.4s; }
.paper-right { transform-origin:left center; transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s; }
.paper-left.open { transform:translateX(-40px) rotate(-8deg) scale(0.9); opacity:0; }
.paper-right.open { transform:translateX(40px) rotate(8deg) scale(0.9); opacity:0; }

/* 盒身下落 */
.box-body { transition: transform 0.5s ease 0.6s, opacity 0.5s ease 0.6s; }
.box-body.open { transform:translateY(30px); opacity:0; }

/* 打开后光晕 */
.gift-glow { position:absolute; top:50%; left:50%; width:100px; height:100px; margin:-50px 0 0 -50px; border-radius:50%; background:radial-gradient(circle, rgba(232,195,140,0.25) 0%, transparent 70%); opacity:0; transition: all 0.8s ease 0.8s; pointer-events:none; }
.gift-glow.show { opacity:1; transform:scale(3); }

.gift-hint { margin-top:20px; font-size:13px; color:rgba(232,195,140,0.4); letter-spacing:4px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

/* 拆开后浮现 */
.gift-reveal { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition: all 1s ease 0.5s; }
.gift-reveal.show { opacity:1; pointer-events:auto; }
.gift-reveal-title { font-size:28px; color:#f5ede0; letter-spacing:6px; text-shadow:0 2px 20px rgba(0,0,0,0.15); font-weight:400; }
.gift-reveal-sub { font-size:12px; color:rgba(232,195,140,0.45); letter-spacing:5px; margin-bottom:28px; margin-top:4px; }
.gift-reveal-btn { padding:12px 40px; border:none; border-radius:40px; background:rgba(232,195,140,0.12); backdrop-filter:blur(8px); color:rgba(245,237,224,0.8); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:4px; border:1px solid rgba(232,195,140,0.10); transition: all 0.35s ease; }
.gift-reveal-btn:hover { background:rgba(232,195,140,0.2); color:#f5ede0; transform:translateY(-1px); }

/* ===== 卡片 ===== */
.vintage-card { position:relative; background:rgba(250,245,235,0.18); backdrop-filter:blur(16px) saturate(1.1); -webkit-backdrop-filter:blur(16px) saturate(1.1); border-radius:28px; padding:20px; box-shadow:0 8px 40px rgba(0,0,0,0.2),0 1px 0 rgba(255,248,235,0.12) inset,0 0 0 1px rgba(255,248,235,0.06) inset; border:1px solid rgba(232,210,180,0.08); max-width:92vw; display:flex; flex-direction:column; align-items:center; }
.corner-deco { position:absolute; font-size:12px; color:rgba(232,195,140,0.2); pointer-events:none; }
.corner-deco.tl { top:12px; left:16px; } .corner-deco.tr { top:12px; right:16px; }
.corner-deco.bl { bottom:12px; left:16px; } .corner-deco.br { bottom:12px; right:16px; }

#step1 .vintage-card { width:520px; max-width:90vw; padding:14px; }
.jar-frame { width:100%; border-radius:20px; overflow:hidden; }
.jar-frame img { display:block; width:100%; height:auto; max-height:56vh; object-fit:contain; border-radius:20px; }
.step1-title { margin:12px 0 2px; font-size:24px; color:#f5ede0; letter-spacing:5px; font-weight:400; text-shadow:0 2px 12px rgba(0,0,0,0.2); }
.step1-sub { font-size:11px; color:rgba(232,195,140,0.45); letter-spacing:4px; margin-bottom:4px; }

/* 第一步音乐控制 */
.music-play-btn { padding:8px 24px; border:none; border-radius:40px; background:rgba(232,195,140,0.08); backdrop-filter:blur(8px); color:rgba(245,237,224,0.5); font-size:12px; font-family:inherit; cursor:pointer; letter-spacing:3px; border:1px solid rgba(232,195,140,0.06); transition:all 0.35s ease; margin-top:4px; }
.music-play-btn:hover { background:rgba(232,195,140,0.14); color:rgba(245,237,224,0.8); }
.music-play-btn.playing { color:rgba(232,195,140,0.6); }

.btn-next,.btn-back { padding:10px 36px; border:none; border-radius:40px; background:rgba(232,195,140,0.15); backdrop-filter:blur(8px); color:rgba(245,237,224,0.8); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:4px; border:1px solid rgba(232,195,140,0.12); transition:all 0.35s ease; text-shadow:0 1px 4px rgba(0,0,0,0.08); }
.btn-next:hover,.btn-back:hover { background:rgba(232,195,140,0.22); color:#f5ede0; transform:translateY(-1px); border-color:rgba(232,195,140,0.2); }
.btn-next:active,.btn-back:active { transform:scale(0.97); }
.btn-back { background:rgba(255,255,255,0.04); color:rgba(245,237,224,0.45); letter-spacing:2px; font-size:12px; padding:7px 20px; }
.btn-back:hover { background:rgba(255,255,255,0.08); color:rgba(245,237,224,0.7); }

#step2 .vintage-card { width:580px; max-width:92vw; padding:18px; }
.words-frame { width:100%; border-radius:18px; overflow:hidden; }
.words-frame img { display:block; width:100%; height:auto; max-height:50vh; object-fit:contain; border-radius:18px; }
.wish-area { width:100%; margin-top:12px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.wish-trigger { padding:9px 30px; border:none; border-radius:40px; background:rgba(232,195,140,0.10); backdrop-filter:blur(8px); color:rgba(245,237,224,0.6); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:3px; border:1px solid rgba(232,195,140,0.08); transition:all 0.35s ease; }
.wish-trigger:hover { background:rgba(232,195,140,0.18); color:rgba(245,237,224,0.85); }
.wish-trigger:active { transform:scale(0.97); }
.wish-display-area { width:100%; min-height:48px; display:flex; align-items:center; justify-content:center; }
.wish-strip { background:rgba(250,245,235,0.08); backdrop-filter:blur(12px); border-radius:16px; padding:10px 22px; font-size:16px; color:#f5ede0; border:1px solid rgba(250,245,235,0.08); opacity:0; transform:translateY(12px) scale(0.94); transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1); letter-spacing:1px; line-height:1.6; text-align:center; max-width:100%; text-shadow:0 1px 6px rgba(0,0,0,0.1); }
.wish-strip.show { opacity:1; transform:translateY(0) scale(1); }

#step3 .vintage-card { width:560px; max-width:90vw; padding:18px; }
.bg-frame { width:100%; border-radius:18px; overflow:hidden; }
.bg-frame img { display:block; width:100%; height:auto; max-height:48vh; object-fit:contain; border-radius:18px; }
.wish3-area { width:100%; margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.wish3-title { font-size:15px; color:rgba(245,237,224,0.8); letter-spacing:3px; text-shadow:0 1px 8px rgba(0,0,0,0.1); }
.wish3-row { width:100%; display:flex; gap:8px; align-items:center; }
.wish3-row input { flex:1; padding:10px 18px; border:none; border-radius:40px; background:rgba(250,245,235,0.06); backdrop-filter:blur(8px); color:#f5ede0; font-size:14px; font-family:inherit; border:1px solid rgba(232,195,140,0.10); outline:none; transition:all 0.35s ease; }
.wish3-row input::placeholder { color:rgba(245,237,224,0.25); }
.wish3-row input:focus { background:rgba(250,245,235,0.10); border-color:rgba(232,195,140,0.2); box-shadow:0 0 20px rgba(232,195,140,0.05); }
.wish3-row button { padding:10px 22px; border:none; border-radius:40px; background:rgba(232,195,140,0.12); backdrop-filter:blur(8px); color:rgba(245,237,224,0.7); font-size:14px; font-family:inherit; cursor:pointer; letter-spacing:2px; border:1px solid rgba(232,195,140,0.08); transition:all 0.35s ease; white-space:nowrap; }
.wish3-row button:hover { background:rgba(232,195,140,0.2); color:#f5ede0; }
.wish3-show { width:100%; min-height:24px; font-size:14px; color:rgba(245,237,224,0.45); text-align:center; letter-spacing:1px; transition:all 0.4s ease; }
.wish3-nav { display:flex; gap:10px; margin-top:2px; flex-wrap:wrap; justify-content:center; }

/* 浮动 */
.floating-item { position:fixed; pointer-events:none; z-index:2; opacity:0; animation:floatDown linear forwards; }
.floating-item svg { display:block; width:100%; height:100%; }
@keyframes floatDown { 0% { opacity:0; transform:translateY(-60px) rotate(0deg) scale(0.3); } 10% { opacity:0.35; } 85% { opacity:0.25; } 100% { opacity:0; transform:translateY(calc(100vh + 80px)) rotate(720deg) scale(1); } }

.bubble { position:fixed; pointer-events:none; z-index:8; animation:bubbleUp 2s ease-out forwards; }
.bubble svg { display:block; width:100%; height:100%; }
@keyframes bubbleUp { 0% { opacity:1; transform:translateY(0) scale(0.2); } 45% { opacity:1; } 100% { opacity:0; transform:translateY(-200px) scale(1.1); } }
.confetti-piece { position:fixed; pointer-events:none; z-index:4; animation:confettiFall linear forwards; }
@keyframes confettiFall { 0% { opacity:1; transform:translateY(-20px) rotate(0deg); } 100% { opacity:0; transform:translateY(calc(100vh + 40px)) rotate(1080deg); } }

@media (max-width:480px) {
  .vintage-card { padding:14px !important; border-radius:20px !important; }
  .step1-title { font-size:20px; }
  .gift-svg-wrap { width:170px; height:170px; }
  .gift-reveal-title { font-size:22px; }
  .wish-strip { font-size:14px; padding:8px 14px; }
}
</style>
</head>
<body>
<div class="page-bg"></div>

<!-- ===== 步骤 0 — 简笔画礼物盒拆封 ===== -->
<div class="step active" id="step0">
  <div class="gift-scene" id="giftScene">
    <div class="gift-svg-wrap">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <!-- 盒身 -->
        <g class="box-body" id="boxBody">
          <rect class="draw-line" x="45" y="100" width="130" height="85" rx="3" />
          <!-- 包装纸纹理线 -->
          <line class="draw-line draw-line-delay" x1="50" y1="115" x2="50" y2="180" stroke-width="1" stroke-dasharray="4 6" />
          <line class="draw-line draw-line-delay" x1="170" y1="110" x2="170" y2="178" stroke-width="1" stroke-dasharray="4 6" />
          <line class="draw-line draw-line-delay2" x1="55" y1="120" x2="165" y2="120" stroke-width="0.8" stroke-dasharray="3 5" />
          <line class="draw-line draw-line-delay2" x1="50" y1="160" x2="170" y2="160" stroke-width="0.8" stroke-dasharray="3 5" />
        </g>
        <!-- 缎带 - 横 -->
        <g class="ribbon-group" id="ribbonGroup">
          <rect class="draw-line draw-line-delay2" x="42" y="133" width="136" height="8" rx="2" stroke-width="1.8" />
          <!-- 缎带 - 纵 -->
          <rect class="draw-line draw-line-delay2" x="102" y="98" width="8" height="89" rx="2" stroke-width="1.8" />
          <!-- 交叉点装饰 -->
          <circle class="draw-line draw-line-delay3" cx="106" cy="137" r="4" stroke-width="1.2" fill="rgba(232,213,181,0.15)" />
        </g>
        <!-- 蝴蝶结 -->
        <g class="bow-group" id="bowGroup">
          <!-- 左环 -->
          <path class="draw-line draw-line-delay3" d="M106 110 Q80 70 95 60 Q105 55 106 90" stroke-width="1.8" />
          <!-- 右环 -->
          <path class="draw-line draw-line-delay3" d="M106 110 Q132 70 117 60 Q107 55 106 90" stroke-width="1.8" />
          <!-- 飘带左 -->
          <path class="draw-line draw-line-delay3" d="M106 110 Q90 130 85 145" stroke-width="1.3" />
          <!-- 飘带右 -->
          <path class="draw-line draw-line-delay3" d="M106 110 Q122 130 127 145" stroke-width="1.3" />
          <!-- 中心结 -->
          <circle class="draw-line draw-line-delay3" cx="106" cy="108" r="4" stroke-width="1.2" fill="rgba(232,213,181,0.2)" />
        </g>
        <!-- 标签 -->
        <text x="106" y="152" text-anchor="middle" font-size="8" fill="rgba(232,213,181,0.25)" letter-spacing="2" class="draw-line draw-line-delay3">For You</text>
      </svg>
      <div class="gift-glow" id="giftGlow"></div>
    </div>
    <div class="gift-hint" id="giftHint">✦  touch to open  ✦</div>
  </div>

  <div class="gift-reveal" id="giftReveal">
    <div class="gift-reveal-title">🎁 胡艺冉 · 25</div>
    <div class="gift-reveal-sub">a gift just for you</div>
    <button class="gift-reveal-btn" id="giftEnterBtn">✦ open  →</button>
  </div>
</div>

<!-- ===== 步骤 1 — 生日隐喻 + 音乐控制 ===== -->
<div class="step" id="step1">
  <div class="vintage-card">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="jar-frame"><img src="生日隐喻.JPG" alt="生日隐喻"></div>
    <div class="step1-title">胡艺冉 · 25</div>
    <div class="step1-sub">all the sweetness in one jar</div>
    <button class="btn-next" id="btn1">进入祝福  →</button>
    <button class="music-play-btn" id="musicPlayBtn">♫ 播放音乐</button>
  </div>
</div>

<!-- ===== 步骤 2 ===== -->
<div class="step" id="step2">
  <div class="vintage-card">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="words-frame"><img src="生日词.jpg" alt="生日词"></div>
    <div class="wish-area">
      <button class="wish-trigger" id="wishTrigger">✦ 点一下 · 收祝福 ✦</button>
      <div class="wish-display-area"><div class="wish-strip" id="wishStrip"></div></div>
      <button class="btn-next" id="btn2" style="margin-top:2px;">写下心愿  →</button>
      <button class="btn-back" id="back2" style="margin-top:6px;">← 返回</button>
    </div>
  </div>
</div>

<!-- ===== 步骤 3 ===== -->
<div class="step" id="step3">
  <div class="vintage-card">
    <span class="corner-deco tl">⌐</span><span class="corner-deco tr">¬</span>
    <span class="corner-deco bl">L</span><span class="corner-deco br">J</span>
    <div class="bg-frame"><img src="生日背景.jpg" alt="生日背景"></div>
    <div class="wish3-area">
      <div class="wish3-title">✍ 许下你的愿望吧小艺冉</div>
      <div class="wish3-row">
        <input type="text" id="customInput" placeholder="输入你的祝福…" maxlength="50">
        <button id="customSubmit">许愿 ✦</button>
      </div>
      <div class="wish3-show" id="customShow"></div>
      <div class="wish3-nav">
        <button class="btn-back" id="back3">← 返回</button>
        <button class="btn-back" id="restartBtn" style="color:rgba(232,195,140,0.5);">⟳ 重新开始</button>
      </div>
    </div>
  </div>
</div>

<audio id="bgAudio" loop preload="metadata">
  <source src="background.m4a" type="audio/mp4">
</audio>

<script>
// ===== SVG =====
const SW='rgba(232,195,140,0.35)', SF='rgba(232,195,140,0.4)';
const SVGS={cat:'<svg viewBox="0 0 48 48"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M16 16 L12 4 L22 13"/><path d="M32 16 L36 4 L26 13"/><circle cx="24" cy="22" r="11"/><circle cx="20" cy="21" r="2" fill="'+SF+'"/><circle cx="28" cy="21" r="2" fill="'+SF+'"/><path d="M22 25 L24 26.5 L26 25" stroke-width="1.2"/><path d="M20 28 Q24 30.5 28 28" stroke-width="1"/><line x1="13" y1="24" x2="18" y2="24.5" stroke-width="1"/><line x1="13" y1="27" x2="18" y2="26.5" stroke-width="1"/><line x1="30" y1="24.5" x2="35" y2="24" stroke-width="1"/><line x1="30" y1="26.5" x2="35" y2="27" stroke-width="1"/><path d="M17 31 Q24 43 31 31"/></g></svg>',butterfly:'<svg viewBox="0 0 44 40"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><path d="M22 18 L12 6 Q8 4 6 8 Q4 12 10 14 L22 18Z"/><path d="M22 18 L12 28 Q8 30 6 26 Q4 22 10 20L22 18Z"/><path d="M22 18 L32 6 Q36 4 38 8 Q40 12 34 14 L22 18Z"/><path d="M22 18 L32 28 Q36 30 38 26 Q40 22 34 20L22 18Z"/><ellipse cx="22" cy="18" rx="1.8" ry="5" fill="'+SF+'"/><path d="M22 12 Q18 7 16 4" stroke-width="1"/><path d="M22 12 Q26 7 28 4" stroke-width="1"/><circle cx="16" cy="4" r="1.2" fill="'+SW+'"/><circle cx="28" cy="4" r="1.2" fill="'+SW+'"/></g></svg>',flower:'<svg viewBox="0 0 42 46"><g fill="none" stroke="'+SW+'" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3"><path d="M21 20 L21 44"/><path d="M18 28 Q11 25 14 30 Q16 33 18 28" stroke-width="1"/><path d="M24 34 Q31 31 28 36 Q26 39 24 34" stroke-width="1"/><circle cx="21" cy="12" r="7"/><circle cx="28" cy="17" r="6.5"/><circle cx="14" cy="17" r="6.5"/><circle cx="28" cy="27" r="6.5"/><circle cx="14" cy="27" r="6.5"/><circle cx="21" cy="19" r="3.5" fill="'+SF+'"/></g></svg>'};
const SKEYS=Object.keys(SVGS);
function createFloating(){var k=SKEYS[Math.floor(Math.random()*SKEYS.length)];var sz=24+Math.random()*20;var el=document.createElement('div');el.className='floating-item';el.style.left=Math.random()*100+'vw';el.style.width=sz+'px';el.style.height=sz+'px';el.style.animationDuration=(14+Math.random()*16)+'s';el.style.animationDelay=(Math.random()*6)+'s';el.innerHTML=SVGS[k];document.body.appendChild(el);setTimeout(function(){el.remove();},32000);}
for(var i=0;i<20;i++)setTimeout(createFloating,i*400);
setInterval(createFloating,900);

// ===== 步骤切换 =====
function goToStep(a,b){var f=document.getElementById(a),t=document.getElementById(b);f.classList.remove('active');f.classList.add('exit');setTimeout(function(){f.classList.remove('exit');f.style.display='none';},800);t.style.display='flex';void t.offsetWidth;t.classList.add('active');}
function goBackTo(a,b){var f=document.getElementById(a),t=document.getElementById(b);f.classList.remove('active');f.classList.add('exit');setTimeout(function(){f.classList.remove('exit');f.style.display='none';},800);t.style.display='flex';void t.offsetWidth;t.classList.add('active');}
function fullReset(){
  ['step3','step2','step1'].forEach(function(id){var el=document.getElementById(id);el.classList.remove('active');el.classList.add('exit');setTimeout(function(){el.classList.remove('exit');el.style.display='none';},800);});
  document.getElementById('step0').style.display='flex';void document.getElementById('step0').offsetWidth;document.getElementById('step0').classList.add('active');
  document.getElementById('boxBody').classList.remove('open');document.getElementById('ribbonGroup').classList.remove('open');document.getElementById('bowGroup').classList.remove('open');document.getElementById('giftGlow').classList.remove('show');document.getElementById('giftReveal').classList.remove('show');document.getElementById('giftHint').style.display='block';
  [].slice.call(document.querySelectorAll('.paper-left,.paper-right')).forEach(function(e){e.classList.remove('open');});
  document.getElementById('wishStrip').className='wish-strip';document.getElementById('customShow').textContent='';musicStartedInStep1=false;
}

// ===== 礼物盒拆封 =====
document.getElementById('giftScene').addEventListener('click',function(){
  document.getElementById('bowGroup').classList.add('open');
  document.getElementById('ribbonGroup').classList.add('open');
  [].slice.call(document.querySelectorAll('.paper-left,.paper-right')).forEach(function(e){e.classList.add('open');});
  document.getElementById('boxBody').classList.add('open');
  document.getElementById('giftGlow').classList.add('show');
  document.getElementById('giftHint').style.display='none';
  launchConfetti(25);
  setTimeout(function(){launchConfetti(15);},400);
  setTimeout(function(){document.getElementById('giftReveal').classList.add('show');},1200);
});
document.getElementById('giftEnterBtn').addEventListener('click',function(){goToStep('step0','step1');launchBubbles();});

// ===== 音乐（用生日歌） =====
var bgAudio=document.getElementById('bgAudio');
var musicStarted=false;
var musicStartedInStep1=false;

function startMusic(){
  if(musicStarted)return;
  musicStarted=true;
  bgAudio.volume=0.3;
  bgAudio.play().then(function(){
    document.getElementById('musicPlayBtn').textContent='♫ 播放中';
    document.getElementById('musicPlayBtn').classList.add('playing');
  }).catch(function(){});
}

// 第一步的音乐播放按钮
document.getElementById('musicPlayBtn').addEventListener('click',function(){
  if(bgAudio.paused){
    startMusic();
  }else{
    bgAudio.pause();
    document.getElementById('musicPlayBtn').textContent='♫ 已暂停';
    document.getElementById('musicPlayBtn').classList.remove('playing');
  }
});

// 进入第二步后右侧小按钮控制
var musicBtn2=null;
function ensureMusicBtn(){
  if(!musicBtn2){
    musicBtn2=document.createElement('button');
    musicBtn2.style.cssText='position:fixed;bottom:24px;right:24px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,195,140,0.10);background:rgba(250,245,235,0.06);backdrop-filter:blur(12px);color:rgba(232,195,140,0.4);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.35s ease;';
    musicBtn2.textContent='♫';
    musicBtn2.addEventListener('click',function(){
      if(bgAudio.paused){startMusic();musicBtn2.classList.add('playing');musicBtn2.style.color='rgba(232,195,140,0.6)';}
      else{bgAudio.pause();musicBtn2.classList.remove('playing');musicBtn2.style.color='rgba(232,195,140,0.4)';}
    });
    document.body.appendChild(musicBtn2);
  }
  musicBtn2.style.display='flex';
  if(!bgAudio.paused)musicBtn2.classList.add('playing');
}

// ===== 后续步骤 =====
document.getElementById('btn1').addEventListener('click',function(){
  goToStep('step1','step2');
  if(musicStarted){ensureMusicBtn();}
  launchBubbles();setTimeout(function(){launchConfetti(20);},300);
});
document.getElementById('btn2').addEventListener('click',function(){
  goToStep('step2','step3');ensureMusicBtn();
  launchBubbles();setTimeout(function(){launchConfetti(30);},400);
});
document.getElementById('back2').addEventListener('click',function(){goBackTo('step2','step1');if(musicBtn2){musicBtn2.style.display='none';}});
document.getElementById('back3').addEventListener('click',function(){goBackTo('step3','step2');});
document.getElementById('restartBtn').addEventListener('click',function(){
  if(musicBtn2){musicBtn2.style.display='none';}
  fullReset();
});

// ===== 许愿 =====
var WISHES=[{text:'胡老师考公上岸，金榜题名！',emoji:'✦'},{text:'胡老师和春宇永远幸福甜蜜！',emoji:'♥'},{text:'顺利美满，万事胜意！',emoji:'✧'}];
var lastIdx=-1;var wishStrip=document.getElementById('wishStrip');
document.getElementById('wishTrigger').addEventListener('click',function(){var idx;do{idx=Math.floor(Math.random()*WISHES.length);}while(idx===lastIdx&&WISHES.length>1);lastIdx=idx;var w=WISHES[idx];wishStrip.innerHTML=w.emoji+'  '+w.text;wishStrip.className='wish-strip show';launchConfetti(12);});
var cInput=document.getElementById('customInput'),cSubmit=document.getElementById('customSubmit'),cShow=document.getElementById('customShow');
cSubmit.addEventListener('click',function(){var v=cInput.value.trim();if(!v){cShow.textContent='✧ 写点什么吧～';cShow.style.color='rgba(245,237,224,0.35)';return;}cShow.innerHTML='♡ 「'+v+'」<br><span style="font-size:12px;opacity:0.6">— may your wish come true ✦</span>';cShow.style.color='rgba(245,237,224,0.8)';cInput.value='';launchConfetti(30);launchBubbles();});
cInput.addEventListener('keydown',function(e){if(e.key==='Enter')cSubmit.click();});

// ===== 手指互动 =====
var sc=['#f5ede0','#e8c8a0','#d4a373','#faedcd','#f8e7d0','#e3d5ca'];var st=0;
function addS(x,y){var el=document.createElement('div');el.style.cssText='position:fixed;pointer-events:none;z-index:99;left:'+(x-3)+'px;top:'+(y-3)+'px;width:'+(4+Math.random()*5)+'px;height:'+(4+Math.random()*5)+'px;border-radius:50%;background:'+sc[Math.floor(Math.random()*sc.length)]+';opacity:'+(0.4+Math.random()*0.4)+';box-shadow:0 0 '+(4+Math.random()*6)+'px rgba(232,195,140,0.3);transition:all 0.6s ease-out;transform:scale(0);';document.body.appendChild(el);requestAnimationFrame(function(){el.style.transform='scale(1) translate('+(-8+Math.random()*16)+'px,'+(-8+Math.random()*16)+'px)';el.style.opacity='0';});setTimeout(function(){el.remove();},700);}
document.addEventListener('touchmove',function(e){var n=Date.now();if(n-st<40)return;st=n;for(var i=0;i<3;i++){var t=e.touches[0];addS(t.clientX+Math.random()*6-3,t.clientY+Math.random()*6-3);}});
document.addEventListener('mousemove',function(e){if(!e.buttons)return;var n=Date.now();if(n-st<50)return;st=n;addS(e.clientX,e.clientY);});
document.addEventListener('click',function(e){var r=document.createElement('div');r.style.cssText='position:fixed;pointer-events:none;z-index:98;left:'+(e.clientX-20)+'px;top:'+(e.clientY-20)+'px;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(232,195,140,0.2);opacity:0.6;transition:all 0.8s ease-out;transform:scale(0.3);';document.body.appendChild(r);requestAnimationFrame(function(){r.style.transform='scale(2.5)';r.style.opacity='0';});setTimeout(function(){r.remove();},900);});
var tx=0;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;});
document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)<60)return;if(dx<0){if(document.getElementById('step1').classList.contains('active'))document.getElementById('btn1').click();else if(document.getElementById('step2').classList.contains('active'))document.getElementById('btn2').click();}else{if(document.getElementById('step2').classList.contains('active'))document.getElementById('back2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('back3').click();}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){if(document.getElementById('step1').classList.contains('active'))document.getElementById('btn1').click();else if(document.getElementById('step2').classList.contains('active'))document.getElementById('btn2').click();}if(e.key==='ArrowLeft'){if(document.getElementById('step2').classList.contains('active'))document.getElementById('back2').click();else if(document.getElementById('step3').classList.contains('active'))document.getElementById('back3').click();}if((e.key==='r'||e.key==='R')&&document.getElementById('step3').classList.contains('active'))fullReset();});

// ===== 庆祝 =====
var CLRS=['#d4a373','#faedcd','#f8e7d0','#e3d5ca','#d5bdaf','#f1d5b5','#e8c8a0','#dcc5b0'];
function launchConfetti(c){for(var i=0;i<c;i++)setTimeout(function(){var p=document.createElement('div');p.className='confetti-piece';p.style.background=CLRS[Math.floor(Math.random()*CLRS.length)];p.style.left=Math.random()*100+'vw';p.style.width=(3+Math.random()*7)+'px';p.style.height=(3+Math.random()*7)+'px';p.style.borderRadius=Math.random()>0.5?'50%':'2px';p.style.animationDuration=(2.5+Math.random()*2.5)+'s';document.body.appendChild(p);setTimeout(function(){p.remove();},5500);},i*30);}
function launchBubbles(){var ks=['cat','butterfly','flower'];for(var i=0;i<5;i++)setTimeout(function(){var k=ks[Math.floor(Math.random()*ks.length)];var sz=16+Math.random()*16;var el=document.createElement('div');el.className='bubble';el.style.left=(15+Math.random()*70)+'%';el.style.bottom='10%';el.style.width=sz+'px';el.style.height=sz+'px';el.innerHTML=SVGS[k];document.body.appendChild(el);setTimeout(function(){el.remove();},2500);},i*120);}
</script>
